apiVersion: batch/v1
kind: Job
metadata:
  name: brats-eval-synthaug-v3
  namespace: gai-lina-group
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 900
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: eval
          image: pytorch/pytorch:2.1.0-cuda11.8-cudnn8-runtime
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "=== GPU ==="
              nvidia-smi | head -5

              echo "=== Installing deps ==="
              pip install -q nibabel matplotlib scikit-image tqdm

              echo "=== Setting up checkpoint and val split ==="
              mkdir -p /data/experiments/synth-aug/improved

              # Copy checkpoint
              if [ ! -f /data/experiments/synth-aug/improved/best.pt ]; then
                cp /data/experiments/synth-aug/best.pt \
                   /data/experiments/synth-aug/improved/best.pt
                echo "Copied best.pt"
              else
                echo "best.pt already present"
              fi

              # Copy val_samples.json so evaluate.py uses the SAME 125 cases as improved
              cp /data/experiments/improved/val_samples.json \
                 /data/experiments/synth-aug/improved/val_samples.json
              echo "Copied val_samples.json"
              echo "Val cases: $(python3 -c "import json; d=json.load(open('/data/experiments/synth-aug/improved/val_samples.json')); print(len(d['val_samples']))")"

              ls -lh /data/experiments/synth-aug/improved/

              echo "=== Running evaluate.py for synth-aug ==="
              python /data/code/evaluate.py \
                --model improved \
                --output_dir /data/experiments/synth-aug

              echo "=== Results ==="
              cat /data/experiments/synth-aug/improved/eval/summary.json 2>/dev/null || echo "No summary"
              head -3 /data/experiments/synth-aug/improved/eval/per_sample.csv 2>/dev/null || echo "No CSV"

              echo "=== Copying to canonical location ==="
              mkdir -p /data/experiments/synth-aug/eval
              cp /data/experiments/synth-aug/improved/eval/per_sample.csv \
                 /data/experiments/synth-aug/eval/per_sample.csv
              cp /data/experiments/synth-aug/improved/eval/summary.json \
                 /data/experiments/synth-aug/eval/summary.json
              echo "Done."

          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "16Gi"
              cpu: "4"
              nvidia.com/gpu: "1"
            limits:
              memory: "19200Mi"
              cpu: "4800m"
              nvidia.com/gpu: "1"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: brats-inpainting-pvc
