apiVersion: batch/v1
kind: Job
metadata:
  name: brats-infer-cwdm-inpaint
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: OnFailure

      securityContext:
        runAsUser: 0
        fsGroup: 0

      tolerations:
        - key: nvidia.com/gpu
          operator: Exists

      containers:
        - name: infer
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          env:
            - name: PYTHONUNBUFFERED
              value: "1"

          command: ["/bin/bash", "-c"]
          args:
            - |
              exec > >(tee -a /data/experiments/cwdm-inpaint/infer.log) 2>&1

              echo "=== GPU Info ==="
              nvidia-smi | head -10

              echo "=== Installing dependencies ==="
              pip install -q nibabel blobfile scikit-learn tqdm wandb

              echo "=== Cloning fast-cwdm repo ==="
              git clone https://github.com/tsereda/fast-cwdm.git /tmp/fast-cwdm

              echo "=== Copying inference script ==="
              cp /data/code/infer_cwdm_inpaint.py /tmp/fast-cwdm/infer_cwdm_inpaint.py

              echo "=== Verifying checkpoint ==="
              ls -lh /data/experiments/cwdm-inpaint/best_model_cwdm_inpaint.pt
              ls -lh /data/experiments/cwdm-inpaint/checkpoint_cwdm_inpaint_iter0300000.pt 2>/dev/null || true

              echo "=== Running CWDM inpainting inference (DDIM 100 steps) ==="
              python /tmp/fast-cwdm/infer_cwdm_inpaint.py \
                --checkpoint /data/experiments/cwdm-inpaint/best_model_cwdm_inpaint.pt \
                --val_dir    /data/brats2023/validation \
                --output_dir /data/experiments/cwdm-inpaint \
                --repo_dir   /tmp/fast-cwdm \
                --ddim_steps 100

              echo "=== Done ==="
              OUTDIR=/data/experiments/cwdm-inpaint/ASNR-MICCAI-BraTS2023-Local-Synthesis-Challenge-Validation-Results
              ls $OUTDIR | head -5
              echo "Total predictions: $(ls $OUTDIR | wc -l)"

          volumeMounts:
            - name: data
              mountPath: /data
            - name: shm
              mountPath: /dev/shm

          resources:
            requests:
              memory: "32Gi"
              cpu: "4"
              nvidia.com/gpu: "1"
            limits:
              memory: "48Gi"
              cpu: "8"
              nvidia.com/gpu: "1"

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: brats-inpainting-pvc
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
